
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <title>我的第一个网址</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      color: #eef3ff;
      background: #080d19;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    header {
      max-width: 1050px;
      margin: auto;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .logo { font-weight: 800; letter-spacing: 1px; }
    nav { display: flex; gap: 20px; color: #aab7d1; font-size: 14px; }
    main { max-width: 1050px; margin: auto; padding: 50px 24px 80px; }
    .hero {
      padding: 65px 0 75px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 35px;
    }
    .tag {
      color: #79aaff;
      font-size: 13px;
      letter-spacing: 2px;
    }
    h1 { font-size: clamp(38px, 7vw, 68px); line-height: 1.15; margin: 18px 0; }
    .desc { color: #aab7d1; font-size: 17px; max-width: 470px; }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 10px;
      background: #4c7dff;
      color: white;
      font-weight: 700;
    }
    .orb {
      min-height: 260px;
      display: grid;
      place-items: center;
      border: 1px solid #263858;
      border-radius: 28px;
      background: radial-gradient(circle at 50% 45%, #243e7b, #10182c 48%, #0b1020 75%);
      box-shadow: 0 0 70px #2349a522;
      font-size: 90px;
    }
    h2 { font-size: 28px; margin-bottom: 8px; }
    .muted { color: #93a3bf; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 25px;
    }
    .card {
      padding: 24px;
      border: 1px solid #24314a;
      border-radius: 16px;
      background: #101727;
    }
    .card .emoji { font-size: 28px; }
    .card h3 { margin: 12px 0 5px; }
    footer {
      text-align: center;
      padding: 25px;
      border-top: 1px solid #1d2940;
      color: #8392ad;
      font-size: 13px;
    }
    @media (max-width: 650px) {
      header { padding: 18px; }
      nav { gap: 12px; font-size: 12px; }
      main { padding: 25px 18px 55px; }
      .hero { grid-template-columns: 1fr; padding: 45px 0; }
      .orb { min-height: 190px; font-size: 70px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#">MY WEBSITE.</a>
    <nav>
      <a href="#home">首页</a>
      <a href="#about">关于</a>
      <a href="#interests">兴趣</a>
      <a href="https://github.com/sxweiping2020">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div>
        <div class="tag">WELCOME TO MY WORLD</div>
        <h1>我的第一个网址<span style="color:#78a5ff">.</span></h1>
        <p class="desc">记录生活、技术与自己的兴趣。这里是我的个人空间，也是探索数字世界的起点。</p>
        <a class="button" href="https://github.com/sxweiping2020">访问我的 GitHub ↗</a>
      </div>
      <div class="orb" aria-label="科技装饰">⌘</div>
    </section>

    <section id="about">
      <h2>关于这里</h2>
      <p class="muted">用简单的网页记录日常，分享技术探索，也留下一些值得回看的瞬间。</p>
    </section>

    <section id="interests" style="margin-top:45px">
      <h2>我的兴趣</h2>
      <p class="muted">保持好奇，持续探索。</p>
      <div class="cards">
        <article class="card">
          <div class="emoji">🌌</div>
          <h3>生活记录</h3>
          <p class="muted">记录日常点滴，珍藏生活中的小发现。</p>
        </article>
        <article class="card">
          <div class="emoji">💻</div>
          <h3>技术探索</h3>
          <p class="muted">了解新工具、新技术，动手实践。</p>
        </article>
        <article class="card">
          <div class="emoji">🚀</div>
          <h3>兴趣世界</h3>
          <p class="muted">保持好奇，让兴趣带我发现更多可能。</p>
        </article>
      </div>
    </section>
  </main>

  <footer>© 2026 我的第一个网址 · 用好奇心探索世界</footer>
</body>
</html>
